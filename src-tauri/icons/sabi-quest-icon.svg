<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Nigerian-inspired gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#008751;stop-opacity:1" /> <!-- Nigerian green -->
      <stop offset="100%" style="stop-color:#00a65a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Golden accent gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Inner ring decoration -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FFD700" stroke-width="8" opacity="0.6"/>
  
  <!-- Book/Quest icon base -->
  <g transform="translate(256, 280)">
    <!-- Open book shape -->
    <path d="M-100,-60 Q-100,-100 -50,-100 L0,-80 L50,-100 Q100,-100 100,-60 L100,60 Q100,80 80,80 L0,60 L-80,80 Q-100,80 -100,60 Z" 
          fill="#FFFFFF" opacity="0.95"/>
    
    <!-- Book spine -->
    <line x1="0" y1="-80" x2="0" y2="60" stroke="url(#goldGradient)" stroke-width="4"/>
    
    <!-- Left page lines -->
    <line x1="-80" y1="-50" x2="-20" y2="-40" stroke="#008751" stroke-width="3" stroke-linecap="round"/>
    <line x1="-80" y1="-25" x2="-20" y2="-15" stroke="#008751" stroke-width="3" stroke-linecap="round"/>
    <line x1="-80" y1="0" x2="-20" y2="10" stroke="#008751" stroke-width="3" stroke-linecap="round"/>
    <line x1="-80" y1="25" x2="-20" y2="35" stroke="#008751" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Right page lines -->
    <line x1="80" y1="-50" x2="20" y2="-40" stroke="#008751" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="-25" x2="20" y2="-15" stroke="#008751" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="0" x2="20" y2="10" stroke="#008751" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="25" x2="20" y2="35" stroke="#008751" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Star/Quest marker on top -->
  <g transform="translate(256, 140)">
    <polygon points="0,-50 15,-15 55,-15 25,10 35,50 0,25 -35,50 -25,10 -55,-15 -15,-15" 
             fill="url(#goldGradient)" filter="url(#shadow)"/>
  </g>
  
  <!-- "S" letter stylized -->
  <text x="256" y="175" 
        font-family="Arial Black, Arial, sans-serif" 
        font-size="48" 
        font-weight="bold"
        fill="#008751" 
        text-anchor="middle" 
        dominant-baseline="middle">S</text>
  
  <!-- Nigerian flag stripe accents at bottom -->
  <g transform="translate(256, 430)">
    <rect x="-80" y="-10" width="50" height="20" rx="5" fill="#008751"/>
    <rect x="-25" y="-10" width="50" height="20" rx="5" fill="#FFFFFF" stroke="#ccc" stroke-width="1"/>
    <rect x="30" y="-10" width="50" height="20" rx="5" fill="#008751"/>
  </g>
  
  <!-- Decorative dots (representing states/knowledge) -->
  <circle cx="130" cy="256" r="8" fill="#FFD700" opacity="0.8"/>
  <circle cx="100" cy="200" r="6" fill="#FFD700" opacity="0.6"/>
  <circle cx="110" cy="310" r="6" fill="#FFD700" opacity="0.6"/>
  
  <circle cx="382" cy="256" r="8" fill="#FFD700" opacity="0.8"/>
  <circle cx="412" cy="200" r="6" fill="#FFD700" opacity="0.6"/>
  <circle cx="402" cy="310" r="6" fill="#FFD700" opacity="0.6"/>
</svg>
