name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (draft/prerelease/release)'
        required: false
        default: 'draft'
        type: choice
        options:
          - draft
          - prerelease
          - release

env:
  CARGO_TERM_COLOR: always
  APP_NAME: Sabi Quest

jobs:
  # Get version from Cargo.toml
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Get version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

  build:
    needs: get-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
            bundle_ext: dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS-x64
            bundle_ext: dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux-x64
            bundle_ext: deb
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows-x64
            bundle_ext: msi

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # For macOS code signing (optional - set up secrets if needed)
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v${{ needs.get-version.outputs.version }}
          releaseName: 'Sabi Quest v${{ needs.get-version.outputs.version }}'
          releaseBody: |
            ## 🇳🇬 Sabi Quest v${{ needs.get-version.outputs.version }} - Learn. Play. Discover Nigeria!
            
            ### 📥 Download for your platform:
            | Platform | Download |
            |----------|----------|
            | **Windows** | `.msi` installer |
            | **macOS (Apple Silicon)** | `.dmg` disk image (arm64) |
            | **macOS (Intel)** | `.dmg` disk image (x64) |
            | **Linux** | `.deb` or `.AppImage` |
            
            ### ✨ What's in this release
            - Explore all 37 Nigerian states
            - Learn Nigerian history, culture, and curriculum
            - Unlock achievements and cultural artifacts
            - Offline-first: Works without internet!
            
            ### 🔧 Installation
            1. Download the file for your operating system
            2. Run the installer
            3. Start learning about Nigeria!
            
            ---
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for detailed changes.
          releaseDraft: ${{ github.event.inputs.release_type == 'draft' || github.event.inputs.release_type == '' }}
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          args: --target ${{ matrix.target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sabi-quest-${{ matrix.name }}-v${{ needs.get-version.outputs.version }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/
          retention-days: 14

  # Create consolidated release
  release:
    needs: [get-version, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded files
        run: |
          echo "📦 Downloaded artifacts:"
          find artifacts -type f -name "*.dmg" -o -name "*.msi" -o -name "*.deb" -o -name "*.AppImage" | head -20

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.deb
            artifacts/**/*.AppImage
          draft: ${{ github.event.inputs.release_type == 'draft' || github.event.inputs.release_type == '' }}
          generate_release_notes: true
          name: Sabi Quest v${{ needs.get-version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Notify on failure (optional - requires Slack webhook)
  notify-failure:
    needs: [build]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Log failure
        run: |
          echo "❌ Build failed for Sabi Quest"
          echo "Check the workflow run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
